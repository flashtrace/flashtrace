name: Release binaries dry run

# Builds the Rust CLI for every release target on the runner matrix the real
# release will use, and uploads the artifacts for inspection. Run by hand to
# prove the per-target toolchains and the arm64 and Intel runners work before
# any release depends on them; it publishes nothing.

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: rust

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # a build takes minutes; a stuck runner would otherwise hold its slot for
    # the 6-hour default
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # No musl-tools: the musl targets bring their own libc and startup
          # files and link with the runner's toolchain. musl-gcc would only
          # compile C code, and no dependency builds any (no cc crate in
          # Cargo.lock). The dry run confirms both targets link without it.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            test: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            test: true
          # Built and tested natively on an Intel runner. Intel macOS images
          # end with Apple's Intel support; once the last one retires, build
          # this target on the arm64 runner instead, cross-compiled, with
          # test: false.
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            test: true
          - target: aarch64-apple-darwin
            runner: macos-14
            test: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            test: true
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            test: true
    permissions:
      contents: read # checkout only; the build runs locally
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Add the target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Test on the target
        if: matrix.test
        shell: bash
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build the release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flashtrace-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/flashtrace
            rust/target/${{ matrix.target }}/release/flashtrace.exe
          retention-days: 7
