name: Publish quality badges

# Chained behind CI via workflow_run instead of living in ci.yml: a job there
# would be listed - permanently "skipped" - in every pull request's checks,
# because GitHub shows all jobs of a triggered workflow even when their `if`
# is false. A workflow_run run never attaches to a pull request's checks, so
# contributors only ever see it where it acts: on pushes to main.
#
# The `branches` filter matches the head branch of the completed CI run, which
# is main only for pushes to main - CI runs for pull requests carry the
# feature branch and create no run here at all. The job-level guard below
# narrows the remaining runs to successful push builds.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  publish:
    name: Publish quality badges
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Serialize publications so two quickly merged PRs - or a merge and the
    # version bump release.yml pushes on top of it - cannot race on the badges
    # branch, where the loser would be rejected as non-fast-forward.
    concurrency:
      group: publish-badges
      cancel-in-progress: false
    # The `badges` branch only accepts pushes from the badges app (a ruleset
    # blocks everyone else), so the push below runs on the app's token and
    # GITHUB_TOKEN stays read-only. actions:read lets download-artifact reach
    # into the completed CI run that triggered this one.
    permissions:
      contents: read
      actions: read
    steps:
      # The `badges` branch is an orphan branch holding nothing but the
      # shields.io endpoint documents that README.md's Quality Summary reads.
      # It shares no history with main and is never merged into it.
      - name: Check out the badges branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: badges
          persist-credentials: false

      # The artifact lives on the CI run that triggered this workflow, not on
      # this run - hence the explicit run-id and token.
      - name: Download the measured badges
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-badges
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BADGES_APP_ID }}
          private-key: ${{ secrets.BADGES_APP_PRIVATE_KEY }}

      # Author the commit as the badges app's bot user so it shows the app's
      # name and avatar. GitHub resolves the identity from the author email,
      # which embeds the bot's user id.
      - name: Commit when a number changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          # The commit CI measured; this run's own GITHUB_SHA points at main's
          # tip when the trigger fired, which may already have moved on.
          MEASURED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add coverage.json tests.json
          if git diff --cached --quiet; then
            echo 'Coverage and test count are unchanged; nothing to publish.'
            exit 0
          fi
          git commit -m "chore: update quality badges for ${MEASURED_SHA:0:7}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:badges
