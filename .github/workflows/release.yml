name: Release

on:
  # pull_request_target instead of pull_request so runs for PRs merged from
  # forks still receive the repo's secrets and variables (the release app
  # credentials); under plain pull_request those are withheld and the app
  # token step fails. This is safe only while the workflow never checks out
  # or executes PR head code - the release job checks out `main` explicitly
  # and operates on the merged result. Do not add a checkout of the PR head
  # here.
  pull_request_target:
    types:
      - closed
    branches:
      - main

# Serialize releases so two quickly merged PRs cannot race on the version bump.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump version and publish
    if: |
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read # pushes and the GitHub Release use the app token below, not GITHUB_TOKEN
      id-token: write # npm trusted publishing (OIDC) with provenance
    steps:
      - name: Determine bump level
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          if [[ " $LABELS " == *" release:major "* ]]; then
            level=major
          elif [[ " $LABELS " == *" release:minor "* ]]; then
            level=minor
          else
            level=patch
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

      # main is protected by a ruleset that GITHUB_TOKEN cannot bypass; the
      # release app is on the ruleset's bypass list, so its token may push the
      # bump commit directly.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # NEVER CHECKOUT the PR head code ALWAYS checkout flashtrace/main only!
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Author the bump commit as the release app's bot user so it shows the
      # app's name and avatar. GitHub resolves the identity from the author
      # email, which embeds the bot's user id.
      - name: Bump version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          npm version "${{ steps.bump.outputs.level }}" -m "release: v%s"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push bump commit and tag
        run: git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes

      # A new release should refresh the docs website, which builds its docs
      # from flashtrace's latest release tag. Dispatch a repository_dispatch
      # event to the site repo, whose deploy workflow listens for this type.
      # A dedicated token scoped to the site repo carries the contents:write
      # that the dispatch API requires, rather than widening the release token
      # above. Best-effort: a missing app install (or site repo) must never
      # fail an otherwise-successful release - the site can also be rebuilt
      # from its own workflow_dispatch or the next release.
      - name: Create website dispatch token
        id: website-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: flashtrace.github.io
          permission-contents: write

      - name: Trigger website redeploy
        if: steps.website-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.website-token.outputs.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository_owner }}/flashtrace.github.io/dispatches" \
            -f event_type=flashtrace-release \
            -f "client_payload[tag]=$TAG"

      - name: Update npm for trusted publishing
        # OIDC trusted publishing requires npm >= 11.5.1; Node 22 ships an older npm.
        run: npm install -g npm@latest

      - name: Publish to npmjs
        run: npm publish
