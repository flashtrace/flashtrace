name: Release

# Trigger on the push of a merge commit to main rather than on the closing
# pull_request event: pull_request runs for PRs from forks receive neither
# secrets nor variables (the release app credentials), and pull_request_target
# grants them at the price of running a secrets-bearing workflow off a
# fork-controlled event (githubactions:S7631). A push to main carries only
# reviewed, merged content, so the run always has the repository's full
# context - regardless of where the PR came from. The gate job recovers the
# release label from the PR whose merge produced the pushed commit.
#
# The version is compiled into the binary, so the bump comes first: the bump
# job commits and tags the new version locally, the build matrix builds and
# tests that commit for every target, and only then does the push job hand
# the commit to main and the tag to the repository - a build that fails for
# real leaves both untouched, so no tag and no version on main ever names a
# release that did not happen. The release job publishes what was built.
on:
  push:
    branches:
      - main

# Serialize releases so two quickly merged PRs cannot race on the version bump.
# queue: max keeps every waiting run: with the default, a group holds a single
# pending run, and the next push to main would cancel it along with its PR's
# release label.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    name: Read release label of the merged PR
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      level: ${{ steps.bump.outputs.level }}
    steps:
      - name: Determine bump level
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # The PR whose merge produced this commit. A push with no such PR
          # (e.g. the version bump commit this workflow itself pushes) yields
          # no labels, so the release is skipped.
          labels=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merge_commit_sha == env.SHA) | .labels[].name] | join(" ")')
          level=""
          case " $labels " in
            *" release:major "*) level=major ;;
            *" release:minor "*) level=minor ;;
            *" release:patch "*) level=patch ;;
          esac
          echo "level=$level" >> "$GITHUB_OUTPUT"

  # The version arithmetic and every file edit are plain shell, each edit
  # verified so a reshaped file fails the release instead of shipping a
  # half-bumped tree. The commit and tag stay in this job's clone and travel
  # on as a bundle: nothing reaches the repository before every target built
  # them, which is why this job can do without write access.
  bump:
    name: Bump version and tag
    needs: gate
    if: needs.gate.outputs.level != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      parent: ${{ steps.version.outputs.parent }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      # "Re-run all jobs" once this run's release commit reached main would
      # release the merge a second time. Before that - a build that failed
      # for real - re-running all jobs is the recovery: merge the fix, then
      # re-run, and the bump releases the tip of main, fix included, under
      # the very version that failed (Cargo.toml on main never moved).
      - name: Refuse to release this merge twice
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # The API rather than git log: the depth-1 checkout has no history.
          # A release commit among the commits main gained since this merge
          # already shipped it - this run's or a later one's.
          released=$(gh api "repos/$REPO/compare/$SHA...main" \
            --jq '[.commits[].commit.message | split("\n")[0] | select(startswith("release: v"))] | first // empty')
          if [ -n "$released" ]; then
            echo "::error::This merge already shipped as ${released#release: } - use \"Re-run failed jobs\" to finish that release."
            exit 1
          fi

      # The tip of main, not github.sha: if another PR merged while this run
      # was queued, the release ships that newer - still reviewed and merged -
      # content under this run's label alone. That PR's own run then finds it
      # released and stops, so its label goes unused: a release:major merged
      # behind a release:patch ships as a patch. Merge labelled PRs one
      # release at a time.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # The bump counts up from Cargo.toml alone, so that number must be the
      # last release: Cargo.lock and CITATION.cff carry the same version, and
      # the newest vX.Y.Z tag - the one record no file edit or merge
      # resolution can touch - names it too. Anything else stops the release
      # before a version is computed from a stale or hand-edited number.
      - name: Verify the release-owned versions agree with the latest tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Cargo.toml's package version, read as the bump below reads it.
          cargo_toml=$(awk '{ sub(/\r$/, "") }
            prev2 == "[package]" && prev1 == "name = \"flashtrace\"" && /^version = "[^"]*"$/ { found++; version = substr($0, 12, length($0) - 12) }
            { prev2 = prev1; prev1 = $0 }
            END { if (found == 1) print version }' Cargo.toml)
          cargo_lock=$(awk '/^name = "flashtrace"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' Cargo.lock)
          citation=$(sed -n 's|^version: *||p' CITATION.cff | sed 's|^"\(.*\)"$|\1|')
          # Fetched apart from the filtering, so a failed request fails the
          # step instead of reading as "no tags".
          tags=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref')
          latest_tag=$(grep -E '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags" | sed 's|^refs/tags/v||' | sort -V | tail -1)
          echo "Cargo.toml: $cargo_toml, Cargo.lock: $cargo_lock, CITATION.cff: $citation, latest tag: v$latest_tag"
          if [ -z "$latest_tag" ]; then
            echo "::error::No vX.Y.Z tag to check the version against."
            exit 1
          fi
          for found in "Cargo.lock:$cargo_lock" "CITATION.cff:$citation" "the latest tag:$latest_tag"; do
            if [ "${found#*:}" != "$cargo_toml" ]; then
              echo "::error::Cargo.toml has version ${cargo_toml}, but ${found%%:*} has ${found#*:}; bring them back in line before releasing."
              exit 1
            fi
          done

      # Only for the app's identity: the commit is authored here, but pushed
      # by the push job, so this token needs no write access.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read

      # Author the bump commit as the release app's bot user so it shows the
      # app's name and avatar. GitHub resolves the identity from the author
      # email, which embeds the bot's user id.
      - name: Bump version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          LEVEL: ${{ needs.gate.outputs.level }}
          REPO: ${{ github.repository }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          # The tip the builds check out and the release commit's parent.
          echo "parent=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # The package version is the one in the lines "[package]", 'name =
          # "flashtrace"', 'version = "..."', in that order and adjacent -
          # never just the first version line, which may be a dependency's.
          # Anything but exactly one such block yields nothing.
          package_version() {
            awk '{ sub(/\r$/, "") }
              prev2 == "[package]" && prev1 == "name = \"flashtrace\"" && /^version = "[^"]*"$/ { found++; version = substr($0, 12, length($0) - 12) }
              { prev2 = prev1; prev1 = $0 }
              END { if (found == 1) print version }' Cargo.toml
          }
          current=$(package_version)
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Cargo.toml::Expected one [package] / name = \"flashtrace\" / version = \"major.minor.patch\" block, found \"${current}\"."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$current"
          case "$LEVEL" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="${major}.$((minor + 1)).0" ;;
            patch) version="${major}.${minor}.$((patch + 1))" ;;
            # Unreachable while the gate maps labels to these three levels, but
            # an empty version would pass every check below and tag "v".
            *)
              echo "::error::Unknown release level \"${LEVEL}\"; expected major, minor or patch."
              exit 1
              ;;
          esac
          echo "Bumping ${current} -> ${version} (${LEVEL})"

          # The push job would refuse an existing tag, but only after every
          # build; an existing tag is known now.
          if gh api "repos/$REPO/git/ref/tags/v${version}" --silent 2> "$RUNNER_TEMP/ref-error"; then
            echo "::error::Tag v${version} already exists; the bump from ${current} has nowhere to go."
            exit 1
          elif ! grep -q "HTTP 404" "$RUNNER_TEMP/ref-error"; then
            cat "$RUNNER_TEMP/ref-error" >&2
            exit 1
          fi

          # Cargo.toml in that very block, Cargo.lock in the package's own
          # [[package]] block.
          sed -i "/^\[package\]$/{n;/^name = \"flashtrace\"$/{n;s/^version = \"[^\"]*\"$/version = \"${version}\"/}}" Cargo.toml
          sed -i "/^name = \"flashtrace\"$/{n;s/^version = .*/version = \"${version}\"/}" Cargo.lock

          # The npm manifests: each package's own version, and the main
          # package's optionalDependencies pins.
          for manifest in npm/flashtrace/package.json npm/@flashtrace/*/package.json; do
            sed -i "s/^  \"version\": \".*\"/  \"version\": \"${version}\"/" "$manifest"
          done
          sed -i "s|\(\"@flashtrace/[a-z0-9-]*\": \"\)[^\"]*\"|\1${version}\"|g" npm/flashtrace/package.json

          # Carry the same version into the citation metadata, dated with the
          # UTC day of this run. Rewriting the lines in place keeps the files'
          # comments, ordering, and quoting intact and needs no parser - this
          # job installs nothing and runs no repository code. The day is taken
          # once, so the edit and its check below cannot straddle midnight.
          released=$(date -u +%Y-%m-%d)
          for field in "version:${version}" "date-released:${released}"; do
            key=${field%%:*}
            value=${field#*:}
            if ! grep -q "^${key}: " CITATION.cff; then
              echo "::error file=CITATION.cff::No \"${key}\" field to update; the release keeps it in sync with Cargo.toml."
              exit 1
            fi
            sed -i "s|^${key}: .*|${key}: \"${value}\"|" CITATION.cff
          done

          # Every edit verified: the bumped version must now appear exactly
          # where it belongs, nowhere stale.
          test "$(package_version)" = "$version"
          test "$(awk '/^name = "flashtrace"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' Cargo.lock)" = "$version"
          for manifest in npm/flashtrace/package.json npm/@flashtrace/*/package.json; do
            test "$(node -p "require('./$manifest').version")" = "$version"
          done
          node -e '
            const manifest = require("./npm/flashtrace/package.json");
            const stale = Object.values(manifest.optionalDependencies).filter((pin) => pin !== manifest.version);
            if (stale.length > 0) { console.error(`stale pins: ${stale}`); process.exit(1); }
          '
          test "$(sed -n 's|^version: ||p' CITATION.cff)" = "\"$version\""
          test "$(sed -n 's|^date-released: ||p' CITATION.cff)" = "\"$released\""

          # The skip-checks trailer stops the push of this commit from
          # creating runs of the push-triggered workflows, which have nothing
          # to do on it: CI verified this tree on the merge push, and this
          # workflow itself would only log a skipped run. The trailer lives in
          # the commit body, keeping the subject a clean "release: vX.Y.Z".
          # GitHub only honors it after two empty lines, which git's default
          # message cleanup would collapse into one - hence verbatim.
          git config commit.cleanup verbatim
          git add Cargo.toml Cargo.lock npm CITATION.cff
          git commit -m "release: v${version}"$'\n\n\n'"skip-checks: true"
          git tag -a "v${version}" -m "release: v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The commit and tag objects themselves, not a recipe for them: a
      # recreated commit would carry other timestamps and so another id. The
      # bundle holds only what the parent lacks, which every later job
      # fetches from main.
      - name: Bundle the release commit and tag
        env:
          PARENT: ${{ steps.version.outputs.parent }}
          VERSION: ${{ steps.version.outputs.version }}
        run: git bundle create "$RUNNER_TEMP/release.bundle" "${PARENT}..HEAD" "refs/tags/v${VERSION}"

      # Kept as long as the run can be re-run (30 days), like the binaries.
      # overwrite: "Re-run all jobs" bumps afresh and bundles another commit.
      - name: Upload the release commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}/release.bundle
          retention-days: 30
          overwrite: true

  # Everything that executes repository-controlled code (the tests, the build)
  # runs here, in jobs that hold no secrets and no id-token permission:
  # nothing these jobs execute can reach the release credentials or the OIDC
  # token exchanges. They build the release commit from the bump job's
  # bundle, so every binary reports the released version.
  build:
    name: Build ${{ matrix.target }}
    needs: bump
    runs-on: ${{ matrix.runner }}
    # a build takes minutes; a stuck runner would otherwise hold its slot for
    # the 6-hour default
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Explicit images, never -latest: a release build changes its image only
      # by a commit. Each target runs natively on a standard runner of the
      # newest GA image; both builds of an OS share one toolchain, which on
      # Windows matters since the VC runtime is linked into the binary. The
      # image does not bound the supported OS versions (static musl, rustc's
      # default macOS deployment target), so bump them as GitHub retires
      # images: https://github.com/actions/runner-images - together with
      # ci.yml, whose tests run the same targets on the same images
      matrix:
        include:
          # No musl-tools: the musl targets bring their own libc and startup
          # files and link with the runner's toolchain. musl-gcc would only
          # compile C code, and no dependency builds any (no cc crate in
          # Cargo.lock).
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
          # Built and tested natively on an Intel runner. Intel macOS images
          # end with Apple's Intel support; once the last one retires, this
          # target can only be cross-compiled on the arm64 runner, where its
          # tests and the npm smoke test cannot run.
          - target: x86_64-apple-darwin
            runner: macos-26-intel
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-pc-windows-msvc
            runner: windows-2025-vs2026
          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
    permissions:
      contents: read
    steps:
      # The release commit is not in the repository yet: check out its
      # parent, which main has, and lay the bundled commit on top.
      - name: Checkout the release commit's parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.parent }}
          persist-credentials: false

      - name: Download the release commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}/release-commit

      - name: Check out the release commit
        shell: bash
        env:
          VERSION: ${{ needs.bump.outputs.version }}
          COMMIT: ${{ needs.bump.outputs.commit }}
        run: |
          git fetch "$RUNNER_TEMP/release-commit/release.bundle" "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git checkout --detach "v${VERSION}"
          test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: Add the target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Test on the target
        shell: bash
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build the release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Archived here, where the file mode still exists: upload-artifact does
      # not preserve the executable bit, a tar does. Each archive holds one
      # folder named like the archive - the binary, and the LICENSE it is
      # redistributed under, with the README - so unpacking it leaves that
      # folder rather than loose files.
      - name: Package the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          name="flashtrace-v${VERSION}-${TARGET}"
          staging=$(mktemp -d)
          mkdir "$staging/$name"
          cp LICENSE README.md "$staging/$name/"
          case "$TARGET" in
            *windows*)
              cp "target/$TARGET/release/flashtrace.exe" "$staging/$name/"
              (cd "$staging" && 7z a "${name}.zip" "$name" > /dev/null)
              archive="${name}.zip"
              ;;
            *)
              cp "target/$TARGET/release/flashtrace" "$staging/$name/"
              tar -czf "$staging/${name}.tar.gz" -C "$staging" "$name"
              archive="${name}.tar.gz"
              ;;
          esac
          mkdir -p assets
          mv "$staging/$archive" assets/
          ls -l assets

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The binary comes back out of the archive just packaged, so the smoke
      # test installs and runs the very bytes the release job publishes.
      - name: Smoke-test the npm packages with the packaged binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          name="flashtrace-v${VERSION}-${TARGET}"
          mkdir smoke-binary
          case "$TARGET" in
            *windows*)
              7z x "assets/${name}.zip" -osmoke-binary > /dev/null
              binary="smoke-binary/${name}/flashtrace.exe"
              ;;
            *)
              tar -xzf "assets/${name}.tar.gz" -C smoke-binary
              binary="smoke-binary/${name}/flashtrace"
              ;;
          esac
          for file in LICENSE README.md; do
            if [ ! -f "smoke-binary/${name}/${file}" ]; then
              echo "::error::${file} is missing from ${name}."
              exit 1
            fi
          done
          node .github/scripts/npm-smoke-test.mjs "$binary"

      # Kept as long as the run can be re-run (30 days): a retried release job
      # must publish these very bytes - a rebuild is not guaranteed to be
      # byte-identical, and the publish guards refuse anything that differs
      # from what an earlier attempt already published. overwrite: after
      # "Re-run all jobs", the binaries of the new release commit replace
      # those of the attempt that failed.
      - name: Upload the packaged binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-${{ matrix.target }}
          path: assets/*
          retention-days: 30
          overwrite: true

  # The only job that writes to the repository, and it runs only after every
  # target built and tested the release commit. It pushes the very commit
  # and tag the builds checked out, taken from the bundle, and only as a
  # fast-forward: main then always reads "... merge, release: vX.Y.Z", and
  # that release commit is exactly the tagged, built one. The bypass of
  # main's ruleset follows the release app, not the token's permissions, so
  # the token carries only what the push needs.
  #
  # Should main move on during the builds, nothing is pushed and the run
  # fails: re-run all jobs, and the bump releases the new tip of main.
  push:
    name: Push release commit and tag
    needs: [bump, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read # the push uses the app token, not GITHUB_TOKEN
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download the release commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}/release-commit

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # --atomic: main and the tag land together or not at all, so a tag on
      # the repository always means main has its commit.
      - name: Push the release commit and tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.bump.outputs.version }}
          PARENT: ${{ needs.bump.outputs.parent }}
          COMMIT: ${{ needs.bump.outputs.commit }}
        run: |
          tag="v${VERSION}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          main=$(git rev-parse HEAD)

          # An earlier attempt of this job already pushed both, and only its
          # report got lost: nothing left to do.
          if [ "$main" = "$COMMIT" ]; then
            pushed=$(git ls-remote "$remote" "refs/tags/${tag}^{}" | awk '{ print $1 }')
            if [ "$pushed" != "$COMMIT" ]; then
              echo "::error::main is at the release commit, but tag ${tag} does not name it."
              exit 1
            fi
            echo "${tag} is already pushed, together with main; skipping."
            exit 0
          fi

          # A merge landed during the builds. The release commit only
          # fast-forwards from the commit it was built on: merged into main it
          # would leave a merge commit, rebased onto it a commit no build
          # checked out.
          if [ "$main" != "$PARENT" ]; then
            echo "::error::main moved on during the builds (built on ${PARENT}, main is at ${main}); nothing was pushed. Re-run all jobs to release the new tip of main."
            exit 1
          fi

          # Outside refs/tags, so a tag of this name the checkout may know
          # is not clobbered by the fetch.
          git fetch --no-tags "$RUNNER_TEMP/release-commit/release.bundle" "refs/tags/${tag}:refs/release/${tag}"
          test "$(git rev-parse "refs/release/${tag}^{commit}")" = "$COMMIT"
          if [ -n "$(git ls-remote "$remote" "refs/tags/${tag}")" ]; then
            echo "::error::Tag ${tag} already exists on another commit."
            exit 1
          fi

          # A merge landing between the checkout and here is rejected as
          # non-fast-forward, before anything was published: re-run all jobs,
          # as above.
          git push --atomic "$remote" "${COMMIT}:refs/heads/main" "refs/release/${tag}:refs/tags/${tag}"

  # This job holds the release credentials (id-token for npm and crates.io
  # trusted publishing, the app key for the GitHub Release) and in exchange
  # executes no repository-controlled code: every step can request an OIDC
  # token, so nothing here compiles the crate. cargo packages with
  # --no-verify - the matrix above built and tested this very tree, and CI
  # builds the packaged crate on every pull request - and npm runs with
  # --ignore-scripts throughout.
  #
  # Every publish is idempotent, so "Re-run failed jobs" recovers a release
  # that failed halfway: the GitHub Release stays a draft until everything
  # else is out, and each package registry is asked first - an identical
  # package already there is skipped, a different one fails the run.
  release:
    name: Publish release, npm packages and crate
    needs: [bump, push]
    runs-on: ubuntu-26.04
    permissions:
      contents: read # the GitHub Release uses the app token below, not GITHUB_TOKEN
      id-token: write # npm and crates.io trusted publishing (OIDC)
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.bump.outputs.version }}
          persist-credentials: false

      - name: Download the packaged binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          merge-multiple: true
          path: assets

      # The GitHub Release only: contents for the release and its assets, and
      # pull requests read for the notes --generate-notes builds from them.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      # A draft, made public only after the registries: the release
      # communicator lists releases with --exclude-drafts, so a draft never
      # counts as the last release.
      - name: Draft the GitHub Release with the binaries
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          (cd assets && sha256sum flashtrace-v* > SHA256SUMS)
          if ! is_draft=$(gh release view "v${VERSION}" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/view-error"); then
            if ! grep -q "release not found" "$RUNNER_TEMP/view-error"; then
              cat "$RUNNER_TEMP/view-error" >&2
              exit 1
            fi
            gh release create "v${VERSION}" --draft --generate-notes assets/*
          elif [ "$is_draft" = true ]; then
            gh release upload "v${VERSION}" --clobber assets/*
          else
            echo "::error::Release v${VERSION} is already public; it is made public only once everything else is published."
            exit 1
          fi

      # crates.io before npm: it checks the crate on upload and allows no
      # deletion, so a refused crate stops the release before any package is
      # public, while an npm failure after it - authentication or an outage -
      # is caught up by re-running the failed job. Asked first, as
      # publish_once below asks npm: cargo package yields the same .crate on
      # every run from the tag checkout (.cargo_vcs_info.json records the
      # tagged commit), so the checksums of a retry match.
      - name: Check whether the crate is already published
        id: crate
        env:
          VERSION: ${{ needs.bump.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # crates.io rejects API requests without a User-Agent.
          status=$(curl -sS -o "$RUNNER_TEMP/crate.json" -w '%{http_code}' \
            -A "flashtrace release workflow (https://github.com/${REPO})" \
            "https://crates.io/api/v1/crates/flashtrace/${VERSION}")
          case "$status" in
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            200)
              cargo package --locked --no-verify
              local_checksum=$(sha256sum "target/package/flashtrace-${VERSION}.crate" | cut -d' ' -f1)
              if [ "$(jq -r .version.checksum "$RUNNER_TEMP/crate.json")" != "$local_checksum" ]; then
                echo "::error::flashtrace ${VERSION} is already on crates.io with different contents."
                exit 1
              fi
              echo "flashtrace ${VERSION} is already on crates.io with identical contents; skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io answered HTTP ${status}."
              cat "$RUNNER_TEMP/crate.json" >&2
              exit 1
              ;;
          esac

      - name: Authenticate with crates.io
        if: steps.crate.outputs.publish == 'true'
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the crate
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: cargo publish --locked --no-verify

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Update npm for trusted publishing
        # OIDC trusted publishing requires npm >= 11.5.1; Node's bundled npm
        # is older. The version is pinned rather than "latest" so a release
        # installs the npm this repository was tested against, and
        # --ignore-scripts keeps this credential-bearing job from executing
        # install hooks.
        run: npm install -g --ignore-scripts npm@11.18.0

      # Each platform package receives its binary, mode restored, and
      # publishes before the main package: the launcher's optionalDependencies
      # must never point at versions that do not exist yet.
      - name: Publish the npm packages
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          # Publishes the package in the given directory unless this version
          # is already on the registry. npm pack yields the same bytes from
          # the same files, so a retry with the same artifacts matches what an
          # earlier attempt published; anything else is a conflicting release.
          # The files after the directory must be in the tarball: npm pack
          # succeeds whatever the copies below put in place, so a dropped
          # copy fails here rather than publishing without it.
          publish_once() {
            local directory=$1 name pack remote expected
            shift
            name=$(jq -r .name "$directory/package.json")
            pack=$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" "./$directory")
            for expected in "$@"; do
              if ! jq -e --arg file "$expected" '.[0].files | any(.path == $file)' <<< "$pack" > /dev/null; then
                echo "::error::$expected is missing from the ${name} tarball."
                return 1
              fi
            done
            # Not yet published is E404 (or, from older npm, empty output).
            if ! remote=$(npm view --prefer-online "${name}@${VERSION}" dist.integrity 2> "$RUNNER_TEMP/view-error"); then
              if ! grep -q E404 "$RUNNER_TEMP/view-error"; then
                cat "$RUNNER_TEMP/view-error" >&2
                return 1
              fi
              remote=""
            fi
            if [ -z "$remote" ]; then
              npm publish --ignore-scripts --access public "$RUNNER_TEMP/$(jq -r '.[0].filename' <<< "$pack")"
            elif [ "$remote" = "$(jq -r '.[0].integrity' <<< "$pack")" ]; then
              echo "${name}@${VERSION} is already published with identical contents; skipping."
            else
              echo "::error::${name}@${VERSION} is already published with different contents."
              return 1
            fi
          }

          declare -A platform_of=(
            [x86_64-unknown-linux-musl]=linux-x64
            [aarch64-unknown-linux-musl]=linux-arm64
            [x86_64-apple-darwin]=darwin-x64
            [aarch64-apple-darwin]=darwin-arm64
            [x86_64-pc-windows-msvc]=win32-x64
            [aarch64-pc-windows-msvc]=win32-arm64
          )
          for target in "${!platform_of[@]}"; do
            platform=${platform_of[$target]}
            # the repository holds no bin/; unzip -d would create it, tar -C
            # does not
            bin_dir="npm/@flashtrace/${platform}/bin"
            mkdir -p "$bin_dir"
            # Only the binary, out of the archive's folder: the LICENSE beside
            # it goes to the package root below, the README stays out.
            name="flashtrace-v${VERSION}-${target}"
            case "$target" in
              *windows*)
                unzip -o -j "assets/${name}.zip" "${name}/flashtrace.exe" -d "$bin_dir"
                ;;
              *)
                tar -xzf "assets/${name}.tar.gz" -C "$bin_dir" --strip-components=1 "${name}/flashtrace"
                chmod +x "$bin_dir/flashtrace"
                ;;
            esac
            # The binary is redistributed under the license, so its text
            # travels with it. The platform packages have no prepack (packed
            # by hand they hold no binary either), so this copy is their
            # only one.
            cp LICENSE "npm/@flashtrace/${platform}/LICENSE"
            publish_once "npm/@flashtrace/${platform}" LICENSE
          done
          # What the launcher's prepack does, which --ignore-scripts skips
          cp README.md LICENSE npm/flashtrace/
          publish_once npm/flashtrace LICENSE README.md

      - name: Make the GitHub Release public
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false

      # A new release should refresh the docs website, which builds its docs
      # from flashtrace's latest release tag. Dispatch a repository_dispatch
      # event to the site repo, whose deploy workflow listens for this type.
      # A dedicated token scoped to the site repo carries the contents:write
      # that the dispatch API requires, rather than widening the release token
      # above. Best-effort: a missing app install (or site repo) must never
      # fail an otherwise-successful release - the site can also be rebuilt
      # from its own workflow_dispatch or the next release.
      - name: Create website dispatch token
        id: website-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: flashtrace.github.io
          permission-contents: write

      - name: Trigger website redeploy
        if: steps.website-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.website-token.outputs.token }}
          TAG: v${{ needs.bump.outputs.version }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository_owner }}/flashtrace.github.io/dispatches" \
            -f event_type=flashtrace-release \
            -f "client_payload[tag]=$TAG"
