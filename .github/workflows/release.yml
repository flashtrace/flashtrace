name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

# Serialize releases so two quickly merged PRs cannot race on the version bump.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    if: |
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read # the push uses the app token below, not GITHUB_TOKEN
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine bump level
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          if [[ " $LABELS " == *" release:major "* ]]; then
            level=major
          elif [[ " $LABELS " == *" release:minor "* ]]; then
            level=minor
          else
            level=patch
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

      # main is protected by a ruleset that GITHUB_TOKEN cannot bypass; the
      # release app is on the ruleset's bypass list, so its token may push the
      # bump commit directly.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Author the bump commit as the release app's bot user so it shows the
      # app's name and avatar. GitHub resolves the identity from the author
      # email, which embeds the bot's user id.
      - name: Bump version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          npm version "${{ steps.bump.outputs.level }}" -m "release: v%s"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push bump commit and tag
        run: git push origin HEAD:main --follow-tags

  # One self-contained executable per supported platform plus their
  # SHA256SUMS, built from the tag the version job just pushed (so the
  # baked-in version is the released one).
  binaries:
    name: Build binaries
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/sea-binaries.yml
    with:
      ref: v${{ needs.version.outputs.version }}

  release:
    name: Create GitHub Release
    needs:
      - version
      - binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read # release creation uses the app token, not GITHUB_TOKEN
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # All artifacts of this run: the per-platform binaries and SHA256SUMS.
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: assets

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --generate-notes assets/*

  publish-npm:
    name: Publish to npmjs
    needs:
      - version
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) with provenance
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Update npm for trusted publishing
        # OIDC trusted publishing requires npm >= 11.5.1; Node 22 ships an older npm.
        run: npm install -g npm@latest

      - name: Publish to npmjs
        run: npm publish
