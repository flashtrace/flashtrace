name: Release Communicator

on:
  # pull_request_target instead of pull_request so runs for PRs opened from
  # forks still receive secrets (the app identity) and a write-capable
  # GITHUB_TOKEN (the fallback), letting the comment post there too. This is
  # safe only while the workflow never checks out or executes PR code - it
  # must keep operating purely on metadata via the API. Do not add a checkout
  # of the PR head here.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
    branches:
      - main
  push:
    branches:
      - main

# Only the latest state matters; drop superseded runs for the same PR (or main).
concurrency:
  group: release-communicator-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  communicate:
    name: Update release preview comment
    runs-on: ubuntu-latest
    # GITHUB_TOKEN permissions only matter for the fallback below; the app
    # token carries its own scopes.
    permissions:
      contents: read # read Cargo.toml from main via the API
      pull-requests: write # create/update the PR comment
    env:
      # The secrets context is not allowed in if conditions (only env is), so
      # the app-token step's guard checks the secret's presence through this.
      HAS_RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # Posting with the app token gives the comment the app's configurable
      # name and avatar instead of github-actions[bot]. Skipped when the
      # secret is unavailable (e.g. a fork of this repo running the workflow
      # on its own PRs), where the comment falls back to GITHUB_TOKEN.
      - name: Create GitHub App token
        id: app-token
        if: ${{ env.HAS_RELEASE_APP_KEY == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read # read Cargo.toml from main via the API
          permission-pull-requests: write # create/update the PR comment

      - name: Upsert release comment
        env:
          # A skipped app-token step yields an empty output, so this falls
          # back to GITHUB_TOKEN and the comment posts as github-actions[bot].
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          marker='<!-- release-communicator -->'

          # Highest release:* label wins, mirroring the release workflow.
          # release:none is the explicit opt-out and ranks below every real
          # level; an empty result means no release:* label is set at all.
          pick_level() {
            local labels=" $1 "
            if [[ "$labels" == *" release:major "* ]]; then echo major
            elif [[ "$labels" == *" release:minor "* ]]; then echo minor
            elif [[ "$labels" == *" release:patch "* ]]; then echo patch
            elif [[ "$labels" == *" release:none "* ]]; then echo none
            fi
          }

          bump() {
            node -e '
              const [major, minor, patch] = process.argv[1].split(".").map(Number);
              const level = process.argv[2];
              if (level === "major") console.log(`${major + 1}.0.0`);
              else if (level === "minor") console.log(`${major}.${minor + 1}.0`);
              else console.log(`${major}.${minor}.${patch + 1}`);
            ' "$1" "$2"
          }

          # Cargo.toml is the release workflow's version source. Read only
          # main via the API: pull_request_target must never execute PR code.
          # Missing/unreadable manifests must fail, not bypass label checks.
          base_version=$(gh api "repos/$REPO/contents/Cargo.toml?ref=main" --jq '.content' \
            | base64 -d \
            | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error file=Cargo.toml::Expected a major.minor.patch package version on main.'
            exit 1
          fi

          if [ -n "${EVENT_PR:-}" ]; then
            prs=$EVENT_PR
          else
            # Push to main: refresh every open PR. The release workflow's
            # version bump commit carries a skip-checks trailer, so its push
            # never runs this workflow - if this push merged a release-labeled
            # PR, anticipate that bump instead of reading a stale version.
            merged_labels=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null) | .labels[].name] | join(" ")')
            merged_level=$(pick_level "$merged_labels")
            if [ -n "$merged_level" ] && [ "$merged_level" != 'none' ]; then
              anticipated_bump=$merged_level
              base_version=$(bump "$base_version" "$merged_level")
            fi
            prs=$(gh pr list --repo "$REPO" --base main --state open --json number --jq '.[].number')
          fi

          # PRs merged since the last release sit unreleased on main and ship
          # with whichever release lands next. When this push anticipated a
          # bump, that backlog is being released right now, so it is empty.
          pending=''
          if [ -z "${anticipated_bump:-}" ]; then
            list_merged_prs() {
              gh pr list --repo "$REPO" --base main --state merged --limit 100 "$@" \
                --json number,title --jq 'sort_by(.number) | .[] | "- #\(.number) \(.title)"'
            }
            last_tag=$(gh release list --repo "$REPO" --exclude-drafts --limit 1 \
              --json tagName --jq '.[0].tagName // empty')
            if [ -n "$last_tag" ]; then
              # The release commit is tagged after its PR merges, so comparing
              # merge times against the tagged commit's time excludes every PR
              # that already shipped, including the one that cut the release.
              released_at=$(gh api "repos/$REPO/commits/$last_tag" --jq '.commit.committer.date')
              pending=$(list_merged_prs --search "merged:>$released_at")
            else
              # No release yet: every merged PR is still waiting for one.
              pending=$(list_merged_prs)
            fi
          fi

          unlabeled_prs=''
          for pr in $prs; do
            labels=$(gh pr view "$pr" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')
            level=$(pick_level "$labels")

            if [ -n "$level" ] && [ "$level" != 'none' ]; then
              next_version=$(bump "$base_version" "$level")
              release_note="Merging this PR triggers a **$level** release (label \`release:$level\`): version **$base_version** will (most likely) be bumped to **$next_version**."
              if [ -n "$pending" ]; then
                release_note=$(printf '%s\n\nThis release will also include the following previously merged, not yet released PRs:\n\n%s' \
                  "$release_note" "$pending")
              fi
              body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
                "$marker" \
                "### :rocket: Release Communicator" \
                "$release_note" \
                "_\"Most likely\" because another release may land on \`main\` first - this comment updates itself when labels, this PR, or \`main\` change._")
            elif [ "$level" = 'none' ]; then
              body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
                "$marker" \
                "### :rocket: Release Communicator" \
                "Merging this PR will **not** trigger a release - the \`release:none\` label is set. The version stays at **$base_version**." \
                "_This comment updates itself when labels, this PR, or \`main\` change._")
            else
              unlabeled_prs="$unlabeled_prs #$pr"
              body=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s' \
                "$marker" \
                "### :rocket: Release Communicator" \
                ":warning: **A release label is required.** Add exactly one of \`release:major\`, \`release:minor\`, \`release:patch\`, or \`release:none\` to this PR." \
                "Until one is set, this workflow fails - and to be clear: **no release will happen** when this PR merges; the version stays at **$base_version**." \
                "_This comment updates itself when labels, this PR, or \`main\` change._")
            fi

            comment_id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
            if [ -n "$comment_id" ]; then
              gh api --silent --method PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body"
            else
              gh api --silent --method POST "repos/$REPO/issues/$pr/comments" -f body="$body"
            fi
          done

          if [ -n "$unlabeled_prs" ]; then
            echo "::error::Missing release label on PR(s):$unlabeled_prs - add one of release:major, release:minor, release:patch, or release:none."
            # Only fail runs belonging to a PR; a push-to-main run refreshes
            # every open PR's comment, and other PRs' missing labels must not
            # paint a red X onto main.
            if [ -n "${EVENT_PR:-}" ]; then
              exit 1
            fi
          fi
