name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read # checkout only; rustfmt and clippy run locally
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # rustup is preinstalled on every GitHub runner and installs the exact
      # toolchain rust-toolchain.toml pins on first use
      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # every runner the release builds on (release.yml), so an image problem
      # surfaces in a PR rather than mid-release; bump the images in both
      # workflows together
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26-intel
          - macos-26
          - windows-2025-vs2026
          - windows-11-vs2026-arm
    permissions:
      contents: read # checkout only; the tests run locally
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test
        run: cargo test --locked

      # Cargo.toml's include list decides what ships; a build script missing
      # from it is dropped from the crate without an error, and crates.io
      # builds would then link the VC runtime dynamically
      - name: Verify the crate packages
        if: runner.os == 'Linux'
        run: |
          files=$(cargo package --locked --list)
          if ! grep -qx build.rs <<< "$files"; then
            echo "::error::build.rs is missing from the packaged crate"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # The test run above built target/debug/flashtrace; the smoke test packs
      # it into this runner's platform package, installs the tarballs into an
      # empty project and runs the installed command. The release build runs
      # the same script against every released binary.
      - name: Smoke-test the npm packages with the built binary
        shell: bash
        run: node .github/scripts/npm-smoke-test.mjs "target/debug/flashtrace${{ runner.os == 'Windows' && '.exe' || '' }}"

  # The npm launcher and platform-package templates ship binaries only at
  # release time; this keeps every package packable. Installing and running
  # them with a real binary is the test job's npm smoke test; the stub checks
  # here cover what it does not, the launcher tarball's contents and the
  # launcher's missing-binary and signal paths.
  npm-packages:
    name: npm launcher packages
    runs-on: ubuntu-26.04
    permissions:
      contents: read # checkout only; the checks run locally
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Parse the launcher
        run: node --check npm/flashtrace/bin/flashtrace.js

      - name: Verify every package packs
        run: |
          for package in npm/flashtrace npm/@flashtrace/*; do
            (cd "$package" && npm pack --dry-run)
          done

      # npm pack succeeds whatever "files" matches, so the launcher's tarball
      # is checked for what a user needs, the prepack-copied README included
      - name: Verify the launcher tarball contents
        run: |
          files=$(cd npm/flashtrace && npm pack --dry-run --json \
            | node -p "JSON.parse(require('fs').readFileSync(0))[0].files.map((file) => file.path).join(' ')")
          echo "packed: $files"
          status=0
          for expected in README.md bin/flashtrace.js package.json; do
            case " $files " in
              *" $expected "*) ;;
              *) echo "::error::$expected is missing from the launcher tarball"; status=1 ;;
            esac
          done
          exit $status

      - name: Run the launcher against a stub binary
        run: |
          stub_dir=npm/flashtrace/node_modules/@flashtrace/linux-x64/bin
          mkdir --parents "$stub_dir"
          printf '#!/bin/sh\necho "stub ran: $@"\nexit 42\n' > "$stub_dir/flashtrace"
          chmod +x "$stub_dir/flashtrace"
          set +e
          output=$(node npm/flashtrace/bin/flashtrace.js --json 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" = 42
          test "$output" = "stub ran: --json"

      - name: Run the launcher without a platform package
        run: |
          rm -rf npm/flashtrace/node_modules
          set +e
          output=$(node npm/flashtrace/bin/flashtrace.js --version 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" = 2
          case "$output" in
            "flashtrace: no prebuilt binary for linux-x64."*) ;;
            *) echo "::error::the launcher did not explain the missing binary"; exit 1 ;;
          esac

      # a binary killed by a signal kills the launcher with the same one, so
      # the shell reports 128 + 15 for SIGTERM rather than a plain failure
      - name: Run the launcher against a stub binary killed by SIGTERM
        run: |
          stub_dir=npm/flashtrace/node_modules/@flashtrace/linux-x64/bin
          mkdir --parents "$stub_dir"
          printf '#!/bin/sh\nkill -TERM $$\n' > "$stub_dir/flashtrace"
          chmod +x "$stub_dir/flashtrace"
          set +e
          node npm/flashtrace/bin/flashtrace.js
          status=$?
          set -e
          rm -rf npm/flashtrace/node_modules
          echo "exit $status"
          test "$status" = 143

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    permissions:
      contents: read # checkout only; coverage runs locally
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Test the CI helper scripts
        run: node --test .github/scripts/*.test.mjs

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # cargo-llvm-cov writes the report but not its directory; nextest's ci
      # profile writes the JUnit report the test-count badge reads
      - name: Measure test coverage
        run: |
          mkdir --parents coverage
          cargo llvm-cov nextest --locked --profile ci --lcov --output-path coverage/lcov.info

      # The badges script also fails the build when a source file appears in
      # no coverage record. lib.rs is the one exemption: it holds only module
      # declarations, which llvm has no code regions for; any executable line
      # it ever gains is compiled into every test binary and brings the
      # record with it.
      - name: Build quality badges
        run: |
          node .github/scripts/quality-badges.mjs \
            coverage/lcov.info target/nextest/ci/junit.xml src badges .rs --exempt lib.rs

      - name: Hand the quality badges to the publishing job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-badges
          path: badges/
          retention-days: 1

  publish-badges:
    name: Publish quality badges
    needs: coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize publications so two quickly merged PRs - or a merge and the
    # version bump release.yml pushes on top of it - cannot race on the badges
    # branch, where the loser would be rejected as non-fast-forward.
    concurrency:
      group: publish-badges
      cancel-in-progress: false
    # The `badges` branch only accepts pushes from the badges app (a ruleset
    # blocks everyone else), so the push below runs on the app's token and
    # GITHUB_TOKEN stays read-only.
    permissions:
      contents: read
    steps:
      # The `badges` branch is an orphan branch holding nothing but the
      # shields.io endpoint documents that README.md's Quality Summary reads.
      # It shares no history with main and is never merged into it.
      - name: Check out the badges branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: badges
          persist-credentials: false

      - name: Download the measured badges
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-badges

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BADGES_APP_ID }}
          private-key: ${{ secrets.BADGES_APP_PRIVATE_KEY }}

      # Author the commit as the badges app's bot user so it shows the app's
      # name and avatar. GitHub resolves the identity from the author email,
      # which embeds the bot's user id.
      - name: Commit when a number changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add coverage.json tests.json
          if git diff --cached --quiet; then
            echo 'Coverage and test count are unchanged; nothing to publish.'
            exit 0
          fi
          git commit -m "chore: update quality badges for ${GITHUB_SHA:0:7}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:badges
