name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read # checkout only; rustfmt and clippy run locally
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup is preinstalled on every GitHub runner and installs the exact
      # toolchain rust-toolchain.toml pins on first use
      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  # Cargo.toml's rust-version is a promise to everyone building the crate
  # from source; clippy's incompatible_msrv only catches newer std APIs, so
  # this proves newer language features and dependency updates keep it too.
  # The tests run rather than a check, so the output contract holds there.
  minimum-rust:
    name: Test on the minimum supported Rust
    runs-on: ubuntu-26.04
    permissions:
      contents: read # checkout only; the tests run locally
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain Cargo.toml names
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          echo "MINIMUM_RUST=$version" >> "$GITHUB_ENV"

      # +toolchain overrides the rust-toolchain.toml pin
      - name: Test on the minimum supported Rust
        run: cargo "+$MINIMUM_RUST" test --locked

  test:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # every target the release builds, on the runner it builds on
      # (release.yml), so an image or target problem surfaces in a PR rather
      # than mid-release; change both matrices together
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
          - target: x86_64-apple-darwin
            runner: macos-26-intel
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-pc-windows-msvc
            runner: windows-2025-vs2026
          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
    permissions:
      contents: read # checkout only; the tests run locally
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      # musl-gcc for mimalloc, the musl targets' allocator (see main.rs) and
      # their one piece of C; the release build installs it the same way
      - name: Install the musl C compiler
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Test on the target
        run: cargo test --locked --target ${{ matrix.target }}

      # The musl binaries must stay static: one linked dynamically still
      # passes every test here, but cannot start on a glibc system, which has
      # no musl loader. C dependencies such as mimalloc are what could change
      # that. The release checks the binary it ships the same way.
      - name: Check the binary is statically linked
        if: contains(matrix.target, 'musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          linkage=$(file --brief "target/$TARGET/debug/flashtrace")
          echo "$linkage"
          if ! grep -q static <<< "$linkage"; then
            echo "::error::the $TARGET binary is not statically linked"
            exit 1
          fi

      # Cargo.toml's include list decides what ships; a build script missing
      # from it is dropped from the crate without an error, and crates.io
      # builds would then link the VC runtime dynamically. The packaged crate
      # is also built from its own files here, the verification the release
      # job skips so that it compiles nothing while holding credentials.
      - name: Verify the crate packages
        if: runner.os == 'Linux'
        run: |
          files=$(cargo package --locked --list)
          if ! grep -qx build.rs <<< "$files"; then
            echo "::error::build.rs is missing from the packaged crate"
            exit 1
          fi
          cargo package --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The test run above built target/<target>/debug/flashtrace; the smoke
      # test packs it into this runner's platform package, installs the
      # tarballs into an empty project and runs the installed command. The
      # release build runs the same script against every released binary.
      - name: Smoke-test the npm packages with the built binary
        shell: bash
        run: node .github/scripts/npm-smoke-test.mjs "target/${{ matrix.target }}/debug/flashtrace${{ runner.os == 'Windows' && '.exe' || '' }}"

  # The npm launcher and platform-package templates ship binaries only at
  # release time; this keeps every package packable. Installing and running
  # them with a real binary is the test job's npm smoke test; the stub checks
  # here cover what it does not, the launcher tarball's contents and the
  # launcher's missing-binary and signal paths.
  npm-packages:
    name: npm launcher packages
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
          - node: 24
          - node: 26
    permissions:
      contents: read # checkout only; the checks run locally
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Parse the launcher
        run: node --check npm/flashtrace/bin/flashtrace.js

      # Only the launcher's contents are checked below; the platform
      # tarballs are checked by the npm smoke test in the test job.
      - name: Verify every package packs
        run: |
          for package in npm/flashtrace npm/@flashtrace/*; do
            (cd "$package" && npm pack --dry-run)
          done

      # npm pack succeeds whatever "files" matches, so the launcher's tarball
      # is checked for what a user needs, the prepack-copied README and
      # LICENSE included
      - name: Verify the launcher tarball contents
        run: |
          files=$(cd npm/flashtrace && npm pack --dry-run --json \
            | node -p "JSON.parse(require('fs').readFileSync(0))[0].files.map((file) => file.path).join(' ')")
          echo "packed: $files"
          status=0
          for expected in LICENSE README.md bin/flashtrace.js package.json; do
            case " $files " in
              *" $expected "*) ;;
              *) echo "::error::$expected is missing from the launcher tarball"; status=1 ;;
            esac
          done
          exit $status

      - name: Run the launcher against a stub binary
        run: |
          stub_dir=npm/flashtrace/node_modules/@flashtrace/linux-x64/bin
          mkdir --parents "$stub_dir"
          printf '#!/bin/sh\necho "stub ran: $@"\nexit 42\n' > "$stub_dir/flashtrace"
          chmod +x "$stub_dir/flashtrace"
          set +e
          output=$(node npm/flashtrace/bin/flashtrace.js --json 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" = 42
          test "$output" = "stub ran: --json"

      - name: Run the launcher without a platform package
        run: |
          rm -rf npm/flashtrace/node_modules
          set +e
          output=$(node npm/flashtrace/bin/flashtrace.js --version 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" = 2
          case "$output" in
            "flashtrace: no prebuilt binary for linux-x64."*) ;;
            *) echo "::error::the launcher did not explain the missing binary"; exit 1 ;;
          esac

      # a binary killed by a signal kills the launcher with the same one, so
      # the shell reports 128 + 15 for SIGTERM rather than a plain failure
      - name: Run the launcher against a stub binary killed by SIGTERM
        run: |
          stub_dir=npm/flashtrace/node_modules/@flashtrace/linux-x64/bin
          mkdir --parents "$stub_dir"
          printf '#!/bin/sh\nkill -TERM $$\n' > "$stub_dir/flashtrace"
          chmod +x "$stub_dir/flashtrace"
          set +e
          node npm/flashtrace/bin/flashtrace.js
          status=$?
          set -e
          rm -rf npm/flashtrace/node_modules
          echo "exit $status"
          test "$status" = 143

  # Share one build across the Node versions so the installed-package checks
  # exercise the same binary on each runtime.
  npm-smoke-build:
    name: Build the npm smoke-test binary
    runs-on: ubuntu-26.04
    permissions:
      contents: read # checkout only; the build runs locally
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add the target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install the musl C compiler
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Build the binary
        run: cargo build --locked --target x86_64-unknown-linux-musl

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-smoke-binary
          path: target/x86_64-unknown-linux-musl/debug/flashtrace
          if-no-files-found: error
          retention-days: 1

  npm-smoke:
    name: npm smoke test on Node ${{ matrix.node }}
    needs: npm-smoke-build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
          - node: 24
          - node: 26
    permissions:
      contents: read # checkout only; the smoke test runs locally
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-smoke-binary
          path: target/x86_64-unknown-linux-musl/debug

      # Artifact downloads do not preserve executable permissions.
      - name: Make the binary executable
        run: chmod +x target/x86_64-unknown-linux-musl/debug/flashtrace

      - name: Smoke-test the npm packages with the built binary
        run: node .github/scripts/npm-smoke-test.mjs "target/x86_64-unknown-linux-musl/debug/flashtrace"

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    permissions:
      contents: read # checkout only; coverage runs locally
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test the CI helper scripts
        run: node --test .github/scripts/*.test.mjs

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # cargo-llvm-cov writes the report but not its directory; nextest's ci
      # profile writes the JUnit report the test-count badge reads
      - name: Measure test coverage
        run: |
          mkdir --parents coverage
          cargo llvm-cov nextest --locked --profile ci --lcov --output-path coverage/lcov.info

      # The badges script also fails the build when a source file appears in
      # no coverage record. lib.rs is the one exemption: it holds only module
      # declarations, which llvm has no code regions for; any executable line
      # it ever gains is compiled into every test binary and brings the
      # record with it.
      - name: Build quality badges
        run: |
          node .github/scripts/quality-badges.mjs \
            coverage/lcov.info target/nextest/ci/junit.xml src badges .rs --exempt lib.rs

      - name: Hand the quality badges to the publishing job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-badges
          path: badges/
          retention-days: 1

  publish-badges:
    name: Publish quality badges
    needs: coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    # Serialize publications so two quickly merged PRs - or a merge and the
    # version bump release.yml pushes on top of it - cannot race on the badges
    # branch, where the loser would be rejected as non-fast-forward.
    concurrency:
      group: publish-badges
      cancel-in-progress: false
    # The `badges` branch only accepts pushes from the badges app (a ruleset
    # blocks everyone else), so the push below runs on the app's token and
    # GITHUB_TOKEN stays read-only.
    permissions:
      contents: read
    steps:
      # The `badges` branch is an orphan branch holding nothing but the
      # shields.io endpoint documents that README.md's Quality Summary reads.
      # It shares no history with main and is never merged into it.
      - name: Check out the badges branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: badges
          persist-credentials: false

      - name: Download the measured badges
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-badges

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BADGES_APP_ID }}
          private-key: ${{ secrets.BADGES_APP_PRIVATE_KEY }}

      # Author the commit as the badges app's bot user so it shows the app's
      # name and avatar. GitHub resolves the identity from the author email,
      # which embeds the bot's user id.
      - name: Commit when a number changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add coverage.json tests.json
          if git diff --cached --quiet; then
            echo 'Coverage and test count are unchanged; nothing to publish.'
            exit 0
          fi
          git commit -m "chore: update quality badges for ${GITHUB_SHA:0:7}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:badges
