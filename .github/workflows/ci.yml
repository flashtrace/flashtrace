name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; build, tests and npm pack run locally
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Ensure committed dist/ matches a fresh build
        run: git diff --exit-code -- dist/

      - name: Test
        run: pnpm run test:coverage

      - name: Verify publishable tarball
        run: npm pack --dry-run

      - name: Build quality badges
        run: node .github/scripts/quality-badges.mjs coverage/lcov.info coverage/junit.xml src badges

      - name: Hand the quality badges to the publishing job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-badges
          path: badges/
          retention-days: 1

  publish-badges:
    name: Publish quality badges
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize publications so two quickly merged PRs - or a merge and the
    # version bump release.yml pushes on top of it - cannot race on the badges
    # branch, where the loser would be rejected as non-fast-forward.
    concurrency:
      group: publish-badges
      cancel-in-progress: false
    # The `badges` branch only accepts pushes from the badges app (a ruleset
    # blocks everyone else), so the push below runs on the app's token and
    # GITHUB_TOKEN stays read-only.
    permissions:
      contents: read
    steps:
      # The `badges` branch is an orphan branch holding nothing but the
      # shields.io endpoint documents that README.md's Quality Summary reads.
      # It shares no history with main and is never merged into it.
      - name: Check out the badges branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: badges
          persist-credentials: false

      - name: Download the measured badges
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-badges

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BADGES_APP_ID }}
          private-key: ${{ secrets.BADGES_APP_PRIVATE_KEY }}

      # Author the commit as the badges app's bot user so it shows the app's
      # name and avatar. GitHub resolves the identity from the author email,
      # which embeds the bot's user id.
      - name: Commit when a number changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add coverage.json tests.json
          if git diff --cached --quiet; then
            echo 'Coverage and test count are unchanged; nothing to publish.'
            exit 0
          fi
          git commit -m "chore: update quality badges for ${GITHUB_SHA:0:7}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:badges
