name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; build, tests and npm pack run locally
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Ensure committed dist/ matches a fresh build
        run: git diff --exit-code -- dist/

      - name: Test
        run: pnpm run test:coverage

      - name: Verify publishable tarball
        run: npm pack --dry-run

      - name: Build quality badges
        run: node .github/scripts/quality-badges.mjs coverage/lcov.info coverage/junit.xml badges

      - name: Hand the quality badges to the publishing job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-badges
          path: badges/
          retention-days: 1

  publish-badges:
    name: Publish quality badges
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the measured numbers to the `badges` branch
    steps:
      # The `badges` branch is an orphan branch holding nothing but the
      # shields.io endpoint documents that README.md's Quality Summary reads.
      # It shares no history with main and is never merged into it.
      - name: Check out the badges branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: badges

      - name: Download the measured badges
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-badges

      - name: Commit when a number changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage.json tests.json
          if git diff --cached --quiet; then
            echo 'Coverage and test count are unchanged; nothing to publish.'
            exit 0
          fi
          git commit -m "chore: update quality badges for ${GITHUB_SHA:0:7}"
          git push
