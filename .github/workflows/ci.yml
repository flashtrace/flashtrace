name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; build, tests and npm pack run locally
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Ensure committed dist/ matches a fresh build
        run: git diff --exit-code -- dist/

      - name: Test
        run: pnpm run test:coverage

      - name: Verify publishable tarball
        run: npm pack --dry-run

      - name: Build quality badges
        run: node .github/scripts/quality-badges.mjs coverage/lcov.info coverage/junit.xml src badges

      # publish-badges.yml picks this artifact up when this run completes on a
      # push to main; on pull requests nothing downstream consumes the badges,
      # so the upload is skipped.
      - name: Hand the quality badges to the publishing workflow
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-badges
          path: badges/
          retention-days: 1
