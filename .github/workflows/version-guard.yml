name: Version guard

on:
  pull_request:
    branches:
      - main

jobs:
  guard:
    name: Block manual version changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; the guard just compares files locally
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The default checkout is the PR merge commit; depth 2 makes its
          # first parent (the base branch tip) available for comparison.
          fetch-depth: 2

      - name: Ensure the release-owned version fields are unchanged
        run: |
          # cat-file -e cannot distinguish "file absent on base" from "HEAD^1
          # unresolvable"; verify the parent first so a broken checkout (e.g.
          # fetch-depth reverted to 1) fails the job instead of skipping it.
          if ! git rev-parse --verify --quiet HEAD^1 >/dev/null; then
            echo '::error::Cannot resolve HEAD^1; the guard needs fetch-depth: 2 on checkout.'
            exit 1
          fi

          # One extractor per file shape; each prints nothing when the file
          # carries no version.
          version_of() {
            case "$1" in
              *.json) node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version ?? ""' ;;
              Cargo.toml) sed -n 's/^version = "\(.*\)"$/\1/p' | head -1 ;;
              Cargo.lock) awk '/^name = "flashtrace"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' ;;
            esac
          }
          # A guarded file must exist, carry a version and keep main's: the
          # release workflow bumps every one of them, so a missing file or
          # field would otherwise surface only after merge, mid-release.
          # Removing a guarded file is a change to the release setup and has
          # to update this guard alongside.
          guard() {
            file=$1
            if ! git cat-file -e "HEAD^1:$file" 2>/dev/null; then
              # Transitional: Cargo.toml and Cargo.lock reach the repository
              # root with the PR that ships the Rust CLI. Once that is on
              # main, a file missing there must fail like one missing here.
              echo "$file does not exist on the base branch; nothing to guard."
              return 0
            fi
            if [ ! -f "$file" ]; then
              echo "::error file=$file::$file is release-owned and must not be removed in a PR; removing it must update this guard and the release workflow."
              exit 1
            fi
            base_version=$(git show "HEAD^1:$file" | version_of "$file")
            pr_version=$(version_of "$file" < "$file")
            echo "$file base: $base_version, PR: $pr_version"
            if [ -z "$base_version" ] || [ -z "$pr_version" ]; then
              echo "::error file=$file::No version found in $file; the release workflow needs one to bump."
              exit 1
            fi
            if [ "$base_version" != "$pr_version" ]; then
              echo "::error file=$file::The version must not be changed in a PR. It is bumped automatically by the release workflow (release:* labels)."
              exit 1
            fi
          }

          guard Cargo.toml
          guard Cargo.lock
          guard npm/flashtrace/package.json

          # The platform packages, written out: adding or dropping one changes
          # the release targets, so it is a deliberate edit of this list.
          platforms='darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64'
          npm_version=$(version_of npm/flashtrace/package.json < npm/flashtrace/package.json)
          for platform in $platforms; do
            manifest="npm/@flashtrace/$platform/package.json"
            if git cat-file -e "HEAD^1:$manifest" 2>/dev/null; then
              guard "$manifest"
            elif [ ! -f "$manifest" ]; then
              echo "::error file=$manifest::$platform is listed as a platform package, but $manifest does not exist."
              exit 1
            elif [ "$(version_of "$manifest" < "$manifest")" != "$npm_version" ]; then
              # Listed in this PR: a new platform starts at the current version.
              echo "::error file=$manifest::The new platform package $platform must start at the main npm package's version $npm_version."
              exit 1
            fi
          done
          # Every platform package in the PR must be listed. Read the PR's
          # packages from git, never a glob: an unmatched glob stays a literal
          # pattern, while an empty listing is a valid one.
          for manifest in $(git ls-tree -r --name-only HEAD -- npm/@flashtrace/ \
              | sed -n '\#^npm/@flashtrace/[^/]*/package\.json$#p'); do
            platform=${manifest#npm/@flashtrace/}
            platform=${platform%/package.json}
            case " $platforms " in
              *" $platform "*) ;;
              *)
                echo "::error file=$manifest::$platform is not a listed platform package; adding one changes the release targets and must extend the list in this guard and the release workflow."
                exit 1
                ;;
            esac
          done

      - name: Ensure the platform-package pins match the main npm package
        run: |
          # The optionalDependencies pins ride the same release bump as the
          # versions; a PR must leave them alone too.
          if [ ! -f npm/flashtrace/package.json ]; then
            echo '::error file=npm/flashtrace/package.json::The main npm package is missing; its optionalDependencies pins are release-owned.'
            exit 1
          fi
          node -e '
            const manifest = require("./npm/flashtrace/package.json");
            const pins = Object.values(manifest.optionalDependencies ?? {});
            const mismatched = pins.filter((pin) => pin !== manifest.version);
            if (mismatched.length > 0) {
              console.error(`optionalDependencies pins ${mismatched.join(", ")} do not match version ${manifest.version}`);
              process.exit(1);
            }
          '

      - name: Ensure CITATION.cff release fields are unchanged
        run: |
          # Same rule as the version guard above (HEAD^1 is already verified):
          # the release workflow sets these fields, so the file and both
          # fields must exist on main and in the PR, with main's values.
          if ! git cat-file -e HEAD^1:CITATION.cff 2>/dev/null; then
            echo '::error file=CITATION.cff::CITATION.cff does not exist on the base branch; its release fields cannot be guarded.'
            exit 1
          fi
          if [ ! -f CITATION.cff ]; then
            echo '::error file=CITATION.cff::CITATION.cff is release-owned and must not be removed in a PR; removing it must update this guard and the release workflow.'
            exit 1
          fi
          # Read the field's value with the surrounding quotes stripped, so
          # requoting a line is not reported as a version change.
          field() {
            sed -n "s|^$2: *||p" "$1" | sed 's|^"\(.*\)"$|\1|'
          }
          git show HEAD^1:CITATION.cff > "$RUNNER_TEMP/base.cff"
          # Only these two fields are release-owned; authors, keywords and the
          # rest of the citation metadata stay freely editable in a PR.
          for key in version date-released; do
            base_value=$(field "$RUNNER_TEMP/base.cff" "$key")
            pr_value=$(field CITATION.cff "$key")
            echo "Base $key: $base_value"
            echo "PR   $key: $pr_value"
            if [ -z "$base_value" ] || [ -z "$pr_value" ]; then
              echo "::error file=CITATION.cff::No \"$key\" field found in CITATION.cff; the release workflow needs one to update."
              exit 1
            fi
            if [ "$base_value" != "$pr_value" ]; then
              echo "::error file=CITATION.cff::The \"$key\" field must not be changed in a PR. It is set automatically by the release workflow (release:* labels)."
              exit 1
            fi
          done
