[package]
name = "flashtrace"
version = "0.12.1"
edition = "2024"
rust-version = "1.97.1"
description = "Lightning-fast, reference-based requirement tracing that works anywhere."
readme = "README.md"
homepage = "https://flashtrace.github.io/"
repository = "https://github.com/flashtrace/flashtrace"
license = "Apache-2.0"
keywords = ["requirements", "traceability", "tracing", "coverage", "cli"]
categories = ["command-line-utilities", "development-tools"]
# the crate ships only its sources; examples and snapshots stay in the repository
include = ["src/**", "LICENSE", "README.md"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jsonschema = { version = "0.48.5", default-features = false, features = ["resolve-file"] }

